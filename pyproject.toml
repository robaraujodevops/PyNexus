[project]
name = "pynexus"
version = "0.1.0"
description = ""
authors = [
  { name = "Roberto Acosta De Araújo", email = "robaraujodevops@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
  "fastapi (>=0.136.0,<0.137.0)",
  "uvicorn[standard] (>=0.44.0,<0.45.0)",
  "sqlalchemy (>=2.0.49,<3.0.0)",
  "alembic (>=1.18.4,<2.0.0)",
  "pydantic-settings (>=2.13.1,<3.0.0)",
  "psycopg2-binary (>=2.9.11,<3.0.0)",
  "passlib[bcrypt] (>=1.7.4,<2.0.0)",
  "pyjwt[crypto] (>=2.12.1,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "pytest (>=9.0.3,<10.0.0)",
  "pytest-asyncio (>=1.3.0,<2.0.0)",
  "httpx (>=0.28.1,<0.29.0)",
  "black (>=26.3.1,<27.0.0)",
  "isort (>=8.0.1,<9.0.0)",
  "flake8 (>=7.3.0,<8.0.0)",
  "mypy (>=1.20.1,<2.0.0)",
]
